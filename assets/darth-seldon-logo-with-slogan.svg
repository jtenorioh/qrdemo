<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1000" fill="#0a0a0a"/>
  
  <!-- Concept 3 Enhanced v3: Orbitron Font + Bold Slogan -->
  
  <!-- Outer circle rings (multiple layers for depth) -->
  <circle cx="400" cy="340" r="230" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="340" r="220" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="400" cy="340" r="200" fill="#0f0f0f" stroke="#dc2626" stroke-width="3" opacity="0.9"/>
  
  <!-- Circuit board pattern background (subtle grid) -->
  <defs>
    <pattern id="circuitGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 0 20 M 0 0 L 20 0" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <circle cx="400" cy="340" r="195" fill="url(#circuitGrid)"/>
  
  <!-- CPU Circuit Sith Symbol -->
  <g id="cpu-circuit-symbol" stroke-linecap="square">
    
    <!-- LARGER Central processor core (red glowing square) -->
    <rect x="350" y="290" width="100" height="100" fill="#1a1a1a" stroke="#dc2626" stroke-width="4"/>
    <rect x="360" y="300" width="80" height="80" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.7"/>
    <rect x="370" y="310" width="60" height="60" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.5"/>
    <rect x="380" y="320" width="40" height="40" fill="#dc2626" opacity="0.4"/>
    
    <!-- CPU pin grid inside (like real processor) -->
    <g id="cpu-pins" fill="#dc2626" opacity="0.3">
      <circle cx="375" cy="315" r="2"/>
      <circle cx="390" cy="315" r="2"/>
      <circle cx="405" cy="315" r="2"/>
      <circle cx="420" cy="315" r="2"/>
      
      <circle cx="375" cy="330" r="2"/>
      <circle cx="390" cy="330" r="2"/>
      <circle cx="405" cy="330" r="2"/>
      <circle cx="420" cy="330" r="2"/>
      
      <circle cx="375" cy="345" r="2"/>
      <circle cx="390" cy="345" r="2"/>
      <circle cx="405" cy="345" r="2"/>
      <circle cx="420" cy="345" r="2"/>
      
      <circle cx="375" cy="360" r="2"/>
      <circle cx="390" cy="360" r="2"/>
      <circle cx="405" cy="360" r="2"/>
      <circle cx="420" cy="360" r="2"/>
    </g>
    
    <!-- Motherboard-style circuit traces with 90-degree angles -->
    
    <!-- NORTH circuit path (with angles) -->
    <g id="north-circuit">
      <!-- Main trace -->
      <path d="M 400 290 L 400 240 L 420 240 L 420 220" stroke="#dc2626" stroke-width="3" fill="none"/>
      <path d="M 400 270 L 380 270 L 380 230 L 360 230 L 360 220" stroke="#6b7280" stroke-width="2" fill="none"/>
      <path d="M 400 270 L 420 270 L 420 250" stroke="#6b7280" stroke-width="2" fill="none"/>
      
      <!-- Connection pads -->
      <rect x="416" y="216" width="8" height="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
      <rect x="356" y="216" width="8" height="8" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
      <circle cx="420" cy="250" r="4" fill="#6b7280"/>
    </g>
    
    <!-- SOUTH circuit path (with angles) -->
    <g id="south-circuit">
      <path d="M 400 390 L 400 440 L 380 440 L 380 460" stroke="#dc2626" stroke-width="3" fill="none"/>
      <path d="M 400 410 L 420 410 L 420 450 L 440 450 L 440 460" stroke="#6b7280" stroke-width="2" fill="none"/>
      <path d="M 400 410 L 380 410 L 380 430" stroke="#6b7280" stroke-width="2" fill="none"/>
      
      <!-- Connection pads -->
      <rect x="376" y="456" width="8" height="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
      <rect x="436" y="456" width="8" height="8" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
      <circle cx="380" cy="430" r="4" fill="#6b7280"/>
    </g>
    
    <!-- WEST circuit path (with angles) -->
    <g id="west-circuit">
      <path d="M 350 340 L 300 340 L 300 320 L 280 320" stroke="#dc2626" stroke-width="3" fill="none"/>
      <path d="M 330 340 L 330 360 L 310 360 L 310 380 L 290 380" stroke="#6b7280" stroke-width="2" fill="none"/>
      <path d="M 330 340 L 330 320 L 310 320" stroke="#6b7280" stroke-width="2" fill="none"/>
      
      <!-- Connection pads -->
      <rect x="276" y="316" width="8" height="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
      <rect x="286" y="376" width="8" height="8" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
      <circle cx="310" cy="320" r="4" fill="#6b7280"/>
    </g>
    
    <!-- EAST circuit path (with angles) -->
    <g id="east-circuit">
      <path d="M 450 340 L 500 340 L 500 360 L 520 360" stroke="#dc2626" stroke-width="3" fill="none"/>
      <path d="M 470 340 L 470 320 L 490 320 L 490 300 L 510 300" stroke="#6b7280" stroke-width="2" fill="none"/>
      <path d="M 470 340 L 470 360 L 490 360" stroke="#6b7280" stroke-width="2" fill="none"/>
      
      <!-- Connection pads -->
      <rect x="516" y="356" width="8" height="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
      <rect x="506" y="296" width="8" height="8" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
      <circle cx="490" cy="360" r="4" fill="#6b7280"/>
    </g>
    
    <!-- NE quadrant traces (blue, motherboard angles) -->
    <path d="M 450 290 L 480 290 L 480 260 L 500 260" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 450 310 L 470 310 L 470 280 L 490 280 L 490 250" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="500" cy="260" r="5" fill="#3b82f6" opacity="0.8"/>
    <circle cx="490" cy="250" r="4" fill="#3b82f6" opacity="0.6"/>
    
    <!-- NW quadrant traces -->
    <path d="M 350 290 L 320 290 L 320 260 L 300 260" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 350 310 L 330 310 L 330 280 L 310 280 L 310 250" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="300" cy="260" r="5" fill="#3b82f6" opacity="0.8"/>
    <circle cx="310" cy="250" r="4" fill="#3b82f6" opacity="0.6"/>
    
    <!-- SE quadrant traces -->
    <path d="M 450 390 L 480 390 L 480 420 L 500 420" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 450 370 L 470 370 L 470 400 L 490 400 L 490 430" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="500" cy="420" r="5" fill="#3b82f6" opacity="0.8"/>
    <circle cx="490" cy="430" r="4" fill="#3b82f6" opacity="0.6"/>
    
    <!-- SW quadrant traces -->
    <path d="M 350 390 L 320 390 L 320 420 L 300 420" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 350 370 L 330 370 L 330 400 L 310 400 L 310 430" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="300" cy="420" r="5" fill="#3b82f6" opacity="0.8"/>
    <circle cx="310" cy="430" r="4" fill="#3b82f6" opacity="0.6"/>
    
    <!-- Additional fine traces (parallel routing like real PCBs) -->
    <path d="M 400 250 L 385 250 L 385 235" stroke="#6b7280" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 400 430 L 415 430 L 415 445" stroke="#6b7280" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 320 340 L 320 355 L 305 355" stroke="#6b7280" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 480 340 L 480 325 L 495 325" stroke="#6b7280" stroke-width="1.5" fill="none" opacity="0.5"/>
    
    <!-- Via connections (small filled circles like PCB vias) -->
    <circle cx="380" cy="270" r="2.5" fill="#dc2626" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="420" cy="270" r="2.5" fill="#dc2626" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="380" cy="410" r="2.5" fill="#dc2626" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="420" cy="410" r="2.5" fill="#dc2626" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="330" cy="320" r="2.5" fill="#3b82f6" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="470" cy="320" r="2.5" fill="#3b82f6" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="330" cy="360" r="2.5" fill="#3b82f6" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="470" cy="360" r="2.5" fill="#3b82f6" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Outer ring connectors (8 points - like chip package pins) -->
    <g id="outer-connectors" stroke="#3a3a3a" stroke-width="2" fill="#1a1a1a">
      <rect x="396" y="175" width="8" height="15" rx="1"/>  <!-- Top -->
      <rect x="396" y="490" width="8" height="15" rx="1"/>  <!-- Bottom -->
      <rect x="225" y="336" width="15" height="8" rx="1"/>  <!-- Left -->
      <rect x="560" y="336" width="15" height="8" rx="1"/>  <!-- Right -->
      <rect x="265" y="195" width="12" height="12" rx="1"/> <!-- Top-left -->
      <rect x="523" y="195" width="12" height="12" rx="1"/> <!-- Top-right -->
      <rect x="265" y="473" width="12" height="12" rx="1"/> <!-- Bottom-left -->
      <rect x="523" y="473" width="12" height="12" rx="1"/> <!-- Bottom-right -->
    </g>
    
    <!-- Glow effects (multiple layers) -->
    <circle cx="400" cy="340" r="110" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.1"/>
    <circle cx="400" cy="340" r="85" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.15"/>
    <circle cx="400" cy="340" r="65" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.2"/>
  </g>
  
  <!-- Arc text (top) - "DARTH SELDON" follows circle curve -->
  <defs>
    <path id="topArc" d="M 200 340 A 200 200 0 0 1 600 340" fill="none"/>
  </defs>
  <text font-family="Orbitron, sans-serif" font-size="32" font-weight="700" fill="#e5e7eb" letter-spacing="8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      DARTH SELDON
    </textPath>
  </text>
  
  <!-- Bottom arc decoration -->
  <path d="M 240 500 Q 400 520 560 500" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="400" cy="520" r="2" fill="#dc2626" opacity="0.6"/>
  
  <!-- BOLD SLOGAN with Orbitron font and stronger design -->
  <g id="slogan">
    <!-- Background glow for slogan -->
    <text x="400" y="630" font-family="Orbitron, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#dc2626" opacity="0.2" letter-spacing="1">
      "YOU DON'T KNOW THE POWER
    </text>
    <text x="400" y="670" font-family="Orbitron, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#dc2626" opacity="0.2" letter-spacing="1">
      OF THE DARK SIDE"
    </text>
    
    <!-- Main slogan text (white with red shadow) -->
    <text x="400" y="630" font-family="Orbitron, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#e5e7eb" letter-spacing="1">
      "YOU DON'T KNOW THE POWER
    </text>
    <text x="400" y="670" font-family="Orbitron, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#e5e7eb" letter-spacing="1">
      OF THE DARK SIDE"
    </text>
  </g>
  
  <!-- Stronger underline with double line -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626; stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#dc2626; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dc2626; stop-opacity:0"/>
    </linearGradient>
  </defs>
  <line x1="220" y1="695" x2="580" y2="695" stroke="url(#redGradient)" stroke-width="3"/>
  <line x1="240" y1="700" x2="560" y2="700" stroke="url(#redGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Tech accent dots (stronger) -->
  <circle cx="400" cy="735" r="4" fill="#dc2626" opacity="0.9"/>
  <circle cx="382" cy="735" r="3" fill="#3b82f6" opacity="0.7"/>
  <circle cx="418" cy="735" r="3" fill="#3b82f6" opacity="0.7"/>
  <circle cx="365" cy="735" r="2" fill="#6b7280" opacity="0.5"/>
  <circle cx="435" cy="735" r="2" fill="#6b7280" opacity="0.5"/>
</svg>
